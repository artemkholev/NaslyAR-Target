upstream main_backend {
    server backend:8080;
}

upstream auth_frontend {
    server frontend-auth:80;
}

server {
    listen 80;
    server_name localhost;
    
    # Корень для статических файлов
    root /usr/share/nginx/html;
    
    # Обработка статических файлов из public
    location /public/ {
        alias /usr/share/nginx/html/public/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        
        # Включаем CORS если нужно
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        
        # Разрешаем листинг директорий (опционально)
        autoindex off;
    }
    
    # Auth microfrontend
    location /auth {
        proxy_pass http://auth_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
    }
    
    # Main API
    location /api {
        proxy_pass http://main_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }
    
    # Основное приложение
    location / {
        try_files $uri $uri/ /index.html;
        
        # Кэширование статики
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
    
    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}