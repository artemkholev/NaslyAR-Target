server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8080;
    }

    # Для Module Federation
    location /remoteEntry.js {
        proxy_pass http://frontend-auth:80;
    }
}