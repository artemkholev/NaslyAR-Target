version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      APP_FRONTEND_URL: http://frontend-host:80
      APP_FRONTEND_DOMAIN: frontend-host
      APP_BACKEND_URL: http://backend:8080
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SMTP_FROM: ${SMTP_FROM}
      EMAIL_LOGIN: ${EMAIL_LOGIN}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8080
    depends_on:
      - postgres

  frontend-host:
    build: ./frontend/host
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://backend:8080
    depends_on:
      - backend

  frontend-auth:
    build: ./frontend/auth
    ports:
      - "3001:80"
    environment:
      VITE_API_URL: http://backend:8080
    depends_on:
      - backend

  adminpanel:
    build: ./adminpanel
    ports:
      - "4000:3000"
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DATABASE_DIALECT: postgres
      DATABASE_NAME: ${DB_NAME}
      DATABASE_HOST: postgres
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET}
      PORT: 4000
    depends_on:
      - postgres

volumes:
  postgres_data:
